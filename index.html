  function hasOwnHref(link){
    if (!OWN_HREF_SELECTOR) return false;
    var matches = link.matches || link.msMatchesSelector || link.webkitMatchesSelector;
    if (!matches) return false;
    try {
      return matches.call(link, OWN_HREF_SELECTOR);
    } catch (err) {
      return false;
    }
  }

  function bindAffiliateLinks(root){
    var links = root.querySelectorAll('a[href]');
    Array.prototype.forEach.call(links, function(link){
      if (hasOwnHref(link)){
        // Link por país: mantém o destino próprio, só herda os parâmetros da URL atual.
        var own = link.getAttribute('href') || '';
        link.href = own && own !== '#' ? withParams(own) : finalUrl;
      } else {
        link.href = finalUrl;
      }
      link.addEventListener('click', function(e){
        if (isEditorPreview()){
          e.preventDefault();
          return;
        }
        clickFired = true;
      });
    });
  }

  function initPopup(){
    document.body.appendChild(fallbackLink);
    showPopup();
    var popup = document.getElementById("captcha-popup-modern");
    bindAffiliateLinks(popup || document);
    
    var VERIFY_DELAY = 900;
    var verificationStarted = false;

    function runVerification(){
      var loading = document.getElementById('captcha-loading-modern');
      var success = document.getElementById('captcha-success-modern');
      var continueBtn = document.getElementById('captcha-continue-modern');

      if (loading) loading.style.display = 'flex';

      setTimeout(function(){
        if (loading) loading.style.display = 'none';
        if (success) success.style.display = 'flex';
        if (continueBtn) continueBtn.focus();
      }, VERIFY_DELAY);
    }

    var checkbox = document.getElementById('captcha-checkbox-modern');
    if (checkbox){
      checkbox.addEventListener('change', function(){
        if (verificationStarted){
          checkbox.checked = true;
          return;
        }
        if (!checkbox.checked) return;
        verificationStarted = true;
        runVerification();
      });
    }

  }

  document.addEventListener('keydown', function(e){
    if (clickFired) return;
    if (e.key === 'Escape'){
      doRedirect();
      return;
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (closestFrom(document.activeElement, "a[href], button, input, select, textarea, [role=\"button\"]")) return;
    doRedirect();
  });

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initPopup);
  } else {
    initPopup();
  }
})();
</script>
